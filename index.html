function dd(a,b){return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d);}
function doy(){var n=new Date();return Math.floor((n-new Date(n.getFullYear(),0,0))/864e5);}
function fmtDate(s){var d=new Date(s+'T00:00:00');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'.charAt(d.getDay());}
function ago(s){var n=dd(today(),s);return n<=0?'今天':n+' 天前';}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none';},2200);}

/* ---------- crypto ---------- */
function b2s(buf){var a=new Uint8Array(buf),s='',i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function s2b(s){var b=atob(s),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function deriveKey(pw,salt){return crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);});}
function encData(){var iv=crypto.getRandomValues(new Uint8Array(12));
 return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},KEY,new TextEncoder().encode(JSON.stringify(D))).then(function(ct){localStorage.setItem(VKEY,JSON.stringify({v:1,salt:b2s(SALT),iv:b2s(iv),ct:b2s(ct)}));});}
function decVault(raw,pw){var o=JSON.parse(raw),salt=s2b(o.salt);
 return deriveKey(pw,salt).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:s2b(o.iv)},k,s2b(o.ct)).then(function(pt){return {k:k,salt:salt,d:JSON.parse(new TextDecoder().decode(pt))};});});}
function save(){if(!D||!KEY)return;clearTimeout(saveT);saveT=setTimeout(flush,120);}
function flush(){clearTimeout(saveT);return (D&&KEY)?encData():Promise.resolve();}
function defData(){return {v:1,members:[],cares:[],prayers:[],days:{},chat:[],sermons:[],meetings:[],duties:[],set:{pname:''}};}
function fixData(d){var k,def=defData();for(k in def)if(d[k]==null)d[k]=def[k];if(!d.set)d.set={pname:''};return d;}

function md(s){s=esc(s);var L=s.split('\n'),o='',i,x,r;
 for(i=0;i<L.length;i++){x=L[i];r=null;
  if((r=/^#{1,4}\s+(.*)$/.exec(x)))o+='<h4>'+r[1]+'</h4>';
  else if((r=/^&gt;\s?(.*)$/.exec(x)))o+='<blockquote>'+r[1]+'</blockquote>';
  else if((r=/^\s*[-*•]\s+(.*)$/.exec(x)))o+='<div class="li">• '+r[1]+'</div>';
  else if((r=/^\s*(\d+)[.、)]\s*(.*)$/.exec(x)))o+='<div class="li">'+r[1]+'. '+r[2]+'</div>';
  else if(/^\s*$/.test(x))o+='';else o+='<p>'+x+'</p>';}
 return o.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}

var BN=['創世記:GEN','出埃及記:EXO','利未記:LEV','民數記:NUM','申命記:DEU','約書亞記:JOS','士師記:JDG','路得記:RUT','撒母耳記上:1SA','撒母耳記下:2SA','列王紀上:1KI','列王紀下:2KI','歷代志上:1CH','歷代志下:2CH','以斯拉記:EZR','尼希米記:NEH','以斯帖記:EST','約伯記:JOB','詩篇:PSA','箴言:PRO','傳道書:ECC','雅歌:SNG','以賽亞書:ISA','耶利米書:JER','耶利米哀歌:LAM','以西結書:EZK','但以理書:DAN','何西阿書:HOS','約珥書:JOL','阿摩司書:AMO','俄巴底亞書:OBA','約拿書:JON','彌迦書:MIC','那鴻書:NAM','哈巴谷書:HAB','西番雅書:ZEP','哈該書:HAG','撒迦利亞書:ZEC','瑪拉基書:MAL','馬太福音:MAT','馬可福音:MRK','路加福音:LUK','約翰福音:JHN','使徒行傳:ACT','羅馬書:ROM','哥林多前書:1CO','哥林多後書:2CO','加拉太書:GAL','以弗所書:EPH','腓立比書:PHP','歌羅西書:COL','帖撒羅尼迦前書:1TH','帖撒羅尼迦後書:2TH','提摩太前書:1TI','提摩太後書:2TI','提多書:TIT','腓利門書:PHM','希伯來書:HEB','雅各書:JAS','彼得前書:1PE','彼得後書:2PE','約翰一書:1JN','約翰二書:2JN','約翰三書:3JN','猶大書:JUD','啟示錄:REV'];
var BCODE={},BNAMES=[],BREG=null,BK={};
(function(){for(var i=0;i<BN.length;i++){var p=BN[i].split(':');BCODE[p[0]]=p[1];BNAMES.push(p[0]);}
 BNAMES.sort(function(a,b){return b.length-a.length;});BREG=new RegExp('('+BNAMES.join('|')+')\\s*(\\d+)\\s*[章篇:：]\\s*(\\d+)(?:\\s*[-–~到至]\\s*(\\d+))?','g');})();
function parseRefs(t,span){span=span||11;t=String(t||'').replace(/列王記/g,'列王紀').replace(/歷代誌/g,'歷代志').replace(/約翰壹書/g,'約翰一書').replace(/約翰貳書/g,'約翰二書').replace(/約翰參書/g,'約翰三書');
 var out=[],seen={},m,re=new RegExp(BREG.source,'g');
 while((m=re.exec(t))!==null&&out.length<6){var a=+m[3],b=m[4]?+m[4]:a;if(b<a||b-a>span)b=a;var k=m[1]+m[2]+':'+a+'-'+b;if(seen[k])continue;seen[k]=1;out.push({bk:m[1],c:+m[2],a:a,b:b});}
 return out;}
function loadBook(code,cb){if(BK[code]!==undefined){cb(BK[code]);return;}
 fetch('bible/'+code+'.json').then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(d){BK[code]=d;cb(d);},function(){BK[code]=undefined;cb(null);});}
function verHtml(refs,books){var o='',i,r,d,t,k;
 for(i=0;i<refs.length;i++){r=refs[i];d=books[BCODE[r.bk]];
  if(d===null||d===undefined){o+='<div class="vv bad">'+esc(r.bk+' '+r.c+':'+r.a)+'：無法載入經文檔（離線或尚未下載），請對照聖經。</div>';continue;}
  t='';for(k=r.a;k<=r.b;k++){var x=d[r.c-1]&&d[r.c-1][k-1];if(!x){t='';break;}t+=x;}
  o+=t?'<div class="vv"><b>'+esc(r.bk+' '+r.c+':'+r.a+(r.b>r.a?'-'+r.b:''))+'</b><br>'+esc(t)+'</div>':'<div class="vv bad">⚠ '+esc(r.bk+' '+r.c+':'+r.a+(r.b>r.a?'-'+r.b:''))+'：找不到這處經文，請以聖經為準。</div>';}
 return o+'<div class="note">只確認「這節經文是否存在、原文是什麼」，不判斷小智的解釋是否正確。以和合本原文為準。</div>';}

  var refs=parseRefs(m.t),codes=[],books={},i,left;for(i=0;i<refs.length;i++){var c=BCODE[refs[i].bk];if(codes.indexOf(c)<0)codes.push(c);}
  left=codes.length;if(!left)return;
  codes.forEach(function(c){loadBook(c,function(d){books[c]=d;if(--left===0){var box=el.querySelector('.vbody');if(box){box.innerHTML=verHtml(refs,books);el.setAttribute('data-done','1');}}});});})(els[n]);}

/* ---------- AI ---------- */
function labelOf(i){return '會友'+('甲乙丙丁戊己庚辛壬癸'.charAt(i)||(i+1));}
function deid(t){var n=0,list=[],i,m,s;
 for(i=0;i<D.members.length;i++){m=D.members[i];s=[m.name,m.nick];if(m.name&&m.name.length>=3)s.push(m.name.slice(1));
  for(var j=0;j<s.length;j++)if(s[j]&&s[j].length>=2)list.push([s[j],labelOf(i)]);}
 list.sort(function(a,b){return b[0].length-a[0].length;});
 for(i=0;i<list.length;i++)if(t.indexOf(list[i][0])>=0){t=t.split(list[i][0]).join(list[i][1]);n++;}
 t=t.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,function(){n++;return '[電郵已移除]';});
 t=t.replace(/https?:\/\/\S+/g,function(){n++;return '[網址已移除]';});
 t=t.replace(/[A-Z][12]\d{8}/g,function(){n++;return '[證號已移除]';});
 t=t.replace(/\+?\d[\d\s\-]{5,}\d/g,function(x){if(/^\d{4}-\d{1,2}-\d{1,2}$/.test(x))return x;n++;return '[數字已移除]';});
 return {t:t,n:n};}
function unlabel(t){for(var i=0;i<D.members.length;i++)t=t.split(labelOf(i)).join(D.members[i].name);return t;}
function wrapMsg(m){var d=deid(m.cmd?m.a:m.t);return m.cmd?CMDS[m.cmd].p+'\n'+d.t:d.t;}
function buildMsgs(){var out=[],a=D.chat.slice(-12),i,m,role,c;
 for(i=0;i<a.length;i++){m=a[i];if(m.crisis||m.err||m.pending)continue;role=m.r==='u'?'user':'assistant';c=m.r==='u'?wrapMsg(m):m.raw;if(!c)continue;
  if(out.length&&out[out.length-1].role===role)out[out.length-1].content+='\n\n'+c;else out.push({role:role,content:c});}
 while(out.length&&out[0].role!=='user')out.shift();return out;}
function extract(d){if(!d)return '';if(typeof d==='string')return d;var t='',i;if(d.content&&d.content.length){for(i=0;i<d.content.length;i++)t+=d.content[i].text||'';if(t)return t;}
 return d.reply||d.text||d.message||(d.choices&&d.choices[0]&&d.choices[0].message?d.choices[0].message.content:'')||'';}
function aiCall(msgs,model,max,cb){var url=SET.proxy||PROXY,tries=0,dl=[900,1800];
 if(navigator.onLine===false){cb(new Error('目前離線'));return;}
 function go(){var ac=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ac)ac.abort();},75000);
  fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model,max_tokens:max,system:SYS,messages:msgs}),signal:ac?ac.signal:undefined})
  .then(function(r){clearTimeout(to);if(!r.ok)throw new Error('http '+r.status);return r.json();})
  .then(function(d){cb(null,d);})
  .catch(function(e){clearTimeout(to);if(tries<dl.length){setTimeout(go,dl[tries++]);}else cb(e);});}
 go();}
function sendChat(){if(busy)return;var ta=$('cin'),txt=ta?ta.value.trim():'';if(!txt)return;
 var r=/^\/(探訪|代禱|簡訊|經文|講綱|講評|勸慰|公告|會議|會記)\s*([\s\S]*)$/.exec(txt),m={r:'u',t:txt};
 if(r){m.cmd=r[1];m.a=r[2]||'';if(!m.a.trim()){toast('請在指令後面寫上情況');return;}}
 m.n=deid(m.cmd?m.a:m.t).n;D.chat.push(m);draft='';
 if(CRISIS_RE.test(txt))D.chat.push({r:'a',crisis:true});
 var ph={r:'a',pending:true};D.chat.push(ph);busy=true;save();paintChat(true);
 var model=(m.cmd&&CMDS[m.cmd].m)?(SET.mDeep||M_DEEP):(SET.mFast||M_FAST),max=m.cmd?CMDS[m.cmd].t:1200,base=buildMsgs(),msgs=base,acc='',cont=0;
 function done(err,txt2){var i=D.chat.indexOf(ph);if(i>=0)D.chat.splice(i,1);
  if(err)D.chat.push({r:'a',err:true,t:'小智暫時連不上（'+(err.name==='AbortError'?'等太久了':err.message)+'）。您的輸入還在，稍後可再試。'});
  else D.chat.push({r:'a',raw:txt2,t:unlabel(txt2)});
  if(D.chat.length>60)D.chat=D.chat.slice(-60);busy=false;save();paintChat(true);}
 function step(){aiCall(msgs,model,max,function(err,d){if(err){if(acc)done(null,acc);else done(err);return;}
  var piece=extract(d);if(!piece&&!acc){done(new Error('沒有收到回答'));return;}acc+=piece;
  if(d&&d.stop_reason==='max_tokens'&&cont<3){cont++;msgs=base.concat([{role:'assistant',content:acc},{role:'user',content:'請從中斷處直接接著寫完，不要重複。'}]);step();return;}
  done(null,acc);});}
 step();}

function doExport(){var raw=localStorage.getItem(VKEY);flush().then(function(){raw=localStorage.getItem(VKEY);

 setTimeout(function(){URL.revokeObjectURL(a.href);document.body.removeChild(a);},1500);toast('已匯出加密備份');});}
function doImport(file){var fr=new FileReader();fr.onload=function(){var o;try{o=JSON.parse(fr.result);}catch(e){}
 if(!o||!o.salt||!o.iv||!o.ct){toast('這不是有效的備份檔');return;}
 if(!confirm('匯入會取代目前這支手機上的所有資料，確定嗎？\n匯入後需用備份當時的密碼解鎖。'))return;
 localStorage.setItem(VKEY,fr.result);D=null;KEY=null;renderLock();toast('已匯入，請用備份的密碼解鎖');};fr.readAsText(file);}
function changePw(){openSheet('更改密碼',fld('o_pw','目前密碼','<input id="o_pw" type="password">')+fld('n_pw','新密碼（至少 6 個字元）','<input id="n_pw" type="password">')+fld('n_pw2','再輸入一次','<input id="n_pw2" type="password">')+'<div class="note warn" id="cperr"></div><div style="margin-top:1rem">'+btn('dochpw','更改','pri blk')+'</div>');}
function doChPw(){var o=$('o_pw').value,n=$('n_pw').value,n2=$('n_pw2').value,e=$('cperr');
 if(n.length<6){e.textContent='新密碼至少 6 個字元';return;}if(n!==n2){e.textContent='兩次輸入不一致';return;}
 decVault(localStorage.getItem(VKEY),o).then(function(){var s=crypto.getRandomValues(new Uint8Array(16));return deriveKey(n,s).then(function(k){SALT=s;KEY=k;return encData();});}).then(function(){closeSheet();toast('密碼已更改，請記牢');},function(){e.textContent='目前密碼不正確';});}

/* ---------- update ---------- */
function checkUpdate(manual){if(navigator.onLine===false){if(manual)toast('目前離線');return;}
 fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  if(j&&j.version&&j.version!==APPVER){upAvail=true;$('updbar').hidden=false;if(manual)toast('有新版本');if(!D)location.reload();}
  else if(manual)toast('已是最新版 v'+APPVER);}).catch(function(){if(manual)toast('檢查失敗');});}
$('updbar').addEventListener('click',function(){if(D){flush().then(function(){location.reload();});}else location.reload();});

/* ---------- boot ---------- */
function boot(){SET=loadSet();applyFont();
 if(!window.crypto||!crypto.subtle){document.body.className='locked';$('main').innerHTML='<div class="lock"><div class="logo">⚠️</div><h1>無法啟動</h1><div class="sub">此瀏覽器或網址不支援加密功能，請改用 https 網址（或 Safari／Chrome 新版）開啟。</div></div>';return;}
 renderLock();
 if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
 setTimeout(function(){checkUpdate(false);},3000);setInterval(function(){checkUpdate(false);},600000);}

boot();
