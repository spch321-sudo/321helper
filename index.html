var AREG=new RegExp('('+Object.keys(ABB).sort(function(a,b){return b.length-a.length;}).join('|')+')\\s*(\\d+)\\s*[:：]\\s*(\\d+)(?:\\s*[-–~到至]\\s*(\\d+))?','g');

 var all=[],m,re=new RegExp(BREG.source,'g'),re2=new RegExp(AREG.source,'g'),out=[],seen={},j;

 for(j=0;j<all.length&&out.length<6;j++){m=all[j].m;var a=+m[3],b=m[4]?+m[4]:a;if(b<a||b-a>span)b=a;var bk=all[j].bk;

function quoteCheck(qs,ri,vt){var i,ok=0,bad=0,nv=nrm(vt),segs,good,any;
